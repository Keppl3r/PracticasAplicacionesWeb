<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

<main class="auth-container">
    <section class="auth-card">

        <!-- TAREA PARA EL ALUMNO:
             Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
             Debe contener campos para:
             - Nombre completo (texto)
             - Correo electrónico (email)
             - Contraseña (password)
             - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
             - Género (radio buttons: Femenino, Masculino, Otro)
             - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
             - Fecha de nacimiento (date)
             - Aceptar términos y condiciones (checkbox)
             - Comentarios adicionales o gustos (textarea)
        -->
        <form class="auth-form" method="post" action="/crear-cuenta">
            <h1>Crear Cuenta</h1>

            <div>
                <label for="nombre">Nombre Completo:</label>
                <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej. Fulanito"
                        required
                        minlength="3"
                        maxlength="100"
                >
            </div>

            <div>
                <label for="contrasenia">Contraseña:</label>
                <input
                        type="password"
                        id="contrasenia"
                        name="contrasenia"
                        placeholder="*********"
                        required
                >
            </div>

            <div>
                <label for="correo">Correo Electronico</label>
                <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="k@mail.com"
                        required
                        minlength="3"
                        maxlength="100"


                >

            </div>

            <div>
                <label for="pseudonimo">Pseudonimo: </label>
                <input
                        type="text"
                        id="pseudonimo"
                        name="pseudonimo"
                        required
                        pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                        placeholder="Nebula-2025"
                >

            </div>

            <div>
                <label>Genero</label>
                <div>
                    <input type="radio" id="rad_femenino" name="genero" value="femenino" required>
                    <label for="rad_femenino">Femenino</label>
                    <input type="radio" id="rad_masculino" name="genero" value="masculino" required>
                    <label for="rad_masculino">Masculino</label>
                    <input type="radio" id="rad_otro" name="genero" value="otro" required>
                    <label for="rad_otro">Otro</label>
                </div>

            </div>


            <div>
                <label for="suscripcion">Tipo de suscripción</label>
                <select id="suscripcion" name="suscripcion" required>
                    <option value=" ">-- Seleccione una opción --</option>
                    <option value="gratis">Gratis pero solo las canciones que yo quiero</option>
                    <option value="premium_mensual">100 por mes premium</option>
                    <option value="premium_anual">25 por mes premium</option>
                </select>
            </div>

            <div>
                <label for="fechaNacimiento">Fecha nacimiento: </label>
                <input
                        type="date"
                        id="fechaNacimiento"
                        name="fechaNacimiento"
                        required>


            </div>

            <div>
                <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
                <label for="terminos">Acepto los terminos y condiciones de uso</label>
            </div>

            <div>
                <label for="comentarios">Comentarios y preferencias</label>
                <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="4"
                        cols="40"
                        placeholder="Cuentanos que musica te gusta"
                ></textarea>
            </div>

            <div>
                <button type="submit">Registrarse</button>
                <button type="reset">Limpiar formulario</button>
            </div>
        </form>
        <p>
            ¿Ya tienes una cuenta? <a href="iniciar-sesion.html">Iniciar sesión aquí</a>
        </p>

    </section>
</main>

<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
