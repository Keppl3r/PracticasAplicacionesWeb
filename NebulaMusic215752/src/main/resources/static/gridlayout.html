<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width">

    <style>
        .contenedor-basico{
            display: grid;
            grid-template-columns: 100px 100px 100px;
            gap: 10px;
            border: 2px solid black;
            padding: 10px;
            background: #f9f9f9;
            margin-bottom: 30px;

        }

        .caja-basica{
            height: 100px;
            background-color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

   /* se aplican estos estilos solo en pantallas
            de 480px o menos */

            @media(max-width: 480px){
                body{
                background-color: black;

                }
                .contenedor-basico{
                grid-template-columns:100px 100px;
                }
            }
        /*
        se aplica solo en pantallas de 768px o mas
        */
        @media(min-width: 768px){
            body{
            background-color:blue;
            }
        }
          /*
        se aplica solo en pantallas de 768px o mas
        */
        @media (width >= 768px){
            body{
                background-color:blue;
            }
        }

        @media (480px <width <768px ){
            body{
            background-color: pink;
            }
        }
        .parent{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        grid-template-rows:repeat(4,100px);
        gap:5px;
        max-width:500px;
        border: 2px solid black;
        padding: 5px;
        background-color:#f9f9f9;
        }
        .parent div{
        border: 10px solid black;
        background-color:#EDF67D;
        display:flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        }

        .div1{
        /* Fila inicio, columna inicio, fila fin, colum fin */
        grid-area:1/1/3/2;
        }

        .div2{
        grid-area:1/2/3/4;

        }

        .div3{
        grid-area:1/4/2/5;

        }

        .div4{
        grid-area:2/4/3/5;
        }

        .div5{
        grid-area:3/1/5/3;
        }
        .div6{
        grid-area:3/3/4/5;
        }

        .div7{
        grid-area:4/3/5/5;
        }
    </style>

</head>
<body>
<div class="parent">
    <div class = "div1">1</div>
    <div class = "div2">2</div>
    <div class = "div3">3</div>
    <div class = "div4">4</div>
    <div class = "div5">5</div>
    <div class = "div6">6</div>
    <div class = "div7">7</div>
</div>

</body>
</html>
